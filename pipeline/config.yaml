# Komorebi Texas Screen — scoring and threshold configuration
# Source: docs/brief.md §2, §5 as amended by docs/build-plan-v2.md §3.
# Every number the pipeline uses to filter, tier or score lives here. Mirrored into the
# Supabase `score_config` table so weight changes made in the web app are versioned.

version: 2026-09-30

assumptions:
  it_mw_per_mwdc: 0.5          # Komorebi: 50 MW firm IT per 100 MWdc
  pue_assumed: 1.15            # placeholder for the cooling-first design; drives the T1a/T1b line
  ilr_default: 1.30            # used only when EIA-860 DC capacity is missing
  fiber_lateral_cost_per_mile_usd: 100000   # range 50k–150k
  fixed_cost_defaults_usd:     # fixed-cost drag inputs when no site-specific estimate exists
    ercot_study: 250000
    title_and_mineral: 150000
    substation_mod: 1500000
    legal_and_transaction: 500000

hard_filters:
  min_ac_mw: 10
  cod_from: 2015-01-01
  cod_to: 2022-12-31
  min_acres_per_mw_ac: 5
  min_acres: 60
  # Filter 4 is about the *site* footprint. USPVDB p_area is the *array* polygon, which runs smaller
  # (Pecos passers 5.2–8.3 ac/MW on array area). Decision 30 Sep 2026: until TxGIO parcels land in Phase 4,
  # acreage on array area only flags (filter_status = review); it does not fail a plant.
  #   array_flag — acreage checks on USPVDB array area → review
  #   parcel     — acreage checks on TxGIO host-parcel area → fail, per plant where parcels were read; others stay array_flag
  footprint_basis: parcel      # decision 5 Oct 2026; plants without usable parcels (parcel_status != ok, or low confidence) stay on array_flag
  technology: utility_pv       # exclude CSP, rooftop, community-solar aggregations
  ercot_only: true             # El Paso Electric and SPP-Panhandle plants are flagged, not dropped
  flag_only:
    - non_ercot_texas

sources:                       # download locations; a file dropped in data/raw/<source>/manual/ overrides the URL
  uspvdb:
    version: "4.0"
    doi: 10.5066/P9IA3TUS
    # Verified 30 Sep 2026: serves uspvdb_v4_0_20260414.shp (6,611 polygons, 187 TX). uspvdbGPKG.zip → 404.
    # If it moves, download the zip by hand into data/raw/uspvdb/manual/.
    urls:
      - https://eerscmap.usgs.gov/uspvdb/assets/data/uspvdbSHP.zip
    area_crs: EPSG:5070        # CONUS Albers equal-area, used to recompute polygon area as a cross-check
  eia860m:
    # {month} = full lowercase month name, {year} = 4 digits. Current file first, then the archive path.
    urls:
      - https://www.eia.gov/electricity/data/eia860m/xls/{month}_generator{year}.xlsx
      - https://www.eia.gov/electricity/data/eia860m/archive/xls/{month}_generator{year}.xlsx
    sheet: Operating
    lookback_months: 6         # walk back from the current month until a published file is found
    pv_energy_source: SUN
    pv_prime_mover: PV
    state: TX
    ercot_ba_code: ERCO        # Balancing Authority Code; EPE / SWPP etc. → non_ercot_texas flag
  eia860:                      # annual survey: plant file (grid voltage) + Schedule 3_3 solar (tracking, module, bifacial)
    # {year} = data year. Tried newest first: final, then early release (ER), then the archive path.
    # Not verified from the cloud sandbox (eia.gov blocked) — the first Windows run confirms.
    urls:
      - https://www.eia.gov/electricity/data/eia860/xls/eia860{year}.zip
      - https://www.eia.gov/electricity/data/eia860/xls/eia860{year}ER.zip
      - https://www.eia.gov/electricity/data/eia860/archive/xls/eia860{year}.zip
    years_back: [1, 2, 3]      # data years to try, counted back from the current calendar year
    plant_file: plant          # zip member name contains this (e.g. 2___Plant_Y2025.xlsx)
    solar_file: solar          # e.g. 3_3_Solar_Y2025.xlsx
    solar_sheets: [Operable]
    key_col: Plant Code
  eia923:                      # net generation by plant and prime mover; 'Respondent Frequency' M | A
    urls:
      - https://www.eia.gov/electricity/data/eia923/xls/f923_{year}.zip
      - https://www.eia.gov/electricity/data/eia923/archive/xls/f923_{year}.zip
    years_back: [1, 2, 3]      # the current year's file is year-to-date, so start one year back
    gen_file: schedules_2_3_4_5
    gen_sheets: [Page 1 Generation and Fuel Data]
    key_col: Plant Id
    pv_prime_mover: PV
    min_months_for_full_year: 12   # monthly respondents need 12 reported months for a full-year CF
    # Respondent Frequency code → cf_series_resolution. Only M guarantees operator-reported months.
    # AM seen on Barilla Solar (58710) in f923_2025; treated as annual (conservative) until EIA docs say otherwise.
    frequency_map: {M: monthly, A: annual, AM: annual}

  ercot:
    # CDR (Capacity, Demand and Reserves) workbook — the one ERCOT file with unit code + county + MW + in-service
    # year. No stable URL: download the latest from https://www.ercot.com/gridinfo/resource into
    # data/raw/ercot_cdr/manual/. Sheets are scanned for a header row containing cdr_key_col.
    cdr_key_col: UNIT CODE
    cdr_solar_fuel_codes: [SOLAR, SOL, PV]   # rows whose fuel column contains any of these
    # 60-day SCED disclosure: one day is enough to list every telemetered PV resource (Resource Type PVGR).
    sced_days_back: 62           # disclosure lags 60 days; ask for a day just past the lag
    sced_pv_resource_type: PVGR

# Phase 4 geo layers. Each layer writes data/layers/<name>.parquet and Supabase table layers_<name>.
layers:
  transmission:
    # Primary: OpenStreetMap power lines/substations (>= 100 kV) for Texas via Overpass. A HIFLD transmission-line
    # file (data.gov / Data Rescue Project mirror) dropped in data/raw/transmission/manual/ replaces OSM for lines.
    # Preferred source: the Geofabrik Texas extract (one ~700 MB file from a CDN; no overloaded API). Needs `pip install osmium`.
    # If it cannot be downloaded or read, the Overpass boxes below are the fallback.
    pbf_url: https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf
    use_pbf: true
    overpass_urls:               # fallback; tried in order; the public servers are often overloaded (504)
      - https://overpass-api.de/api/interpreter
      - https://overpass.private.coffee/api/interpreter
      - https://overpass.kumi.systems/api/interpreter
      - https://maps.mail.ru/osm/tools/overpass/api/interpreter
    overpass_timeout_s: 90       # per bounding-box query; fail fast and move to the next mirror (the statewide query timed out)
    bbox_half_deg: 0.9           # query boxes of 1.8 x 1.8 degrees centred on a snap-grid cell around each plant (small = fast)
    bbox_snap_deg: 0.25          # plants in the same grid cell share one box
    search_radius_mi: 40         # guaranteed coverage around every plant (box half-width minus snap offset); scoring bands stop at 15 mi; a missing distance means 'none within this radius'
    pause_s: 2
    min_kv: 100                  # lines below this are not fetched
    kv_classes: [138, 230, 345, 500]   # reported as the voltage classes seen near a plant
    near_miles: 3                # radius for kv_classes_within_near and the POI-voltage cross-check
    class_tolerance: 0.05        # a line of 138.0 kV matches an EIA POI of 138 kV within 5%

  gas_pipelines:
    # Texas RRC public viewer, layer 12 "QPipelines" (generalized lines, WGS84, 1000 features per page). Same endpoint
    # MapsMaker uses (docs/RRC_PIPELINES_WELLS_SETUP.md there). Note the /server/rest/ path, not /arcgis/rest/.
    # Display only: the brief lists gas proximity as a data source (bridge/backup generation), not a scored metric.
    layer_url: https://gis.rrc.texas.gov/server/rest/services/rrc_public/RRC_Public_Viewer_Srvs/MapServer/12
    status_in_service: In Service
    commodities: [NATURAL GAS, NATURAL GAS FWS, NATURAL GAS OFFSHORE, OTHER GAS]
    transmission_system_types: [Natural/Other Gas Transmission]   # SYSTEM_TYPE prefix; everything else is gathering/other
    bbox_half_deg: 0.40          # query boxes centred on a snap-grid cell around each plant
    bbox_snap_deg: 0.25
    search_radius_mi: 15         # guaranteed coverage (box half-width minus snap offset, at 36 N); beyond it a distance is null
    near_miles: 5                # radius for the count / largest diameter of gas transmission lines near a plant
    pause_s: 0.5

  flood:
    # FEMA National Flood Hazard Layer MapServer: layer 28 Flood Hazard Zones (FLD_ZONE, ZONE_SUBTY, SFHA_TF) and layer 0
    # NFHL Availability (digital FIRM study areas). Many rural Texas counties (Pecos, Milam) have no digital NFHL: those
    # plants get flood_status not_mapped, never "no flood risk". MapsMaker draws layer 28 as raster tiles; here we query
    # the polygons and clip them with the array.
    service_url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer
    zones_layer: 28
    availability_layer: 0
    availability_offset_deg: 0.0001   # study-area outlines are generalized to ~10 m by the server (they are whole counties)
    # SFHA zones and 0.2% / Zone D polygons only; minimal-hazard Zone X polygons are large and not needed
    where: "SFHA_TF = 'T' OR ZONE_SUBTY LIKE '0.2 PCT%' OR FLD_ZONE = 'D'"
    flag_sfha_share: 0.10        # brief §3: "kill criterion if substantial footprint in Zone A/AE" — flagged, not auto-failed
    point_buffer_m: 300          # plants with no USPVDB polygon: a buffer around the EIA point (confidence low)
    pause_s: 0.5

  parcels:
    # TxGIO StratMap Land Parcels. No stable download URL: put the county zips (or the statewide file) in
    # data/raw/parcels/manual/ — shapefile / GeoPackage / File Geodatabase, zipped or not. Only the neighbourhood of each
    # plant is read (bounding-box query) and cached under data/raw/parcels/selected/, so a big file can be deleted afterwards.
    neighborhood_m: 3000         # parcels within this distance of the array are read (same-owner expansion is limited to it)
    min_overlap_acres: 1.0       # a parcel is a "host" when the array overlaps it by >= this ...
    min_overlap_frac: 0.02       # ... or by >= this share of the array (slivers from digitising are not hosts)
    adjacency_tol_m: 2           # touching = within this distance
    max_expansion_rounds: 6      # same-owner contiguous parcels are added breadth-first up to this many steps
    unified_min_owner_share: 0.90  # unified land control: one owner holds >= this share of the host-parcel acres
    point_buffer_m: 100          # plants with no USPVDB polygon: parcels within this distance of the EIA point (confidence low)
    owner_stopwords: [llc, lp, llp, lllp, inc, corp, corporation, co, company, ltd, trust, tr, et, al, ux, vir, estate, of, the]
    fields:                      # candidate column names (normalised) per attribute, first match wins
      owner: [owner_name, ownername, owner, own_name, owner1]
      prop_id: [prop_id, propid, geo_id, geoid, property_id]
      land_use: [stat_land_use, state_cd, land_use, loc_land_use, landuse]
      market_value: [mkt_value, market_value, market, total_value, appraised, tot_value]
      land_value: [land_value, landvalue, land_val]
      county: [county, county_name, cnty_name, countyname]
      year: [tax_year, taxyear, year, data_year, source_year]

units:
  m2_per_acre: 4046.8564224

tiers:                         # AC MW bounds; lower bound inclusive, upper bound exclusive
  # sb6_line = sb6.large_load_threshold_mw / (pue_assumed × it_mw_per_mwdc × ilr_default)
  #          = 75 / (1.15 × 0.5 × 1.30) = 100.33 MW AC — moves when any of the four inputs changes.
  T3: {label: Modular,              min_ac_mw: 10,       max_ac_mw: 25}
  T2: {label: Mid,                  min_ac_mw: 25,       max_ac_mw: 75}
  T1a: {label: Anchor sub-threshold, min_ac_mw: 75,       max_ac_mw: sb6_line}
  T1b: {label: Anchor SB6 path,      min_ac_mw: sb6_line, max_ac_mw: null}
sb6:
  large_load_threshold_mw: 75  # PUCT 16 TAC §25.194 draft (Mar 2026); Docket 59220 (Jul 2026)
  # planned_load_mw = ac_mw * ilr * it_mw_per_mwdc * pue_assumed
  # sb6_review_required = planned_load_mw >= large_load_threshold_mw

scoring:
  max_total: 100
  # quantile (decision 3 Oct 2026, plan §3 change 5): cut points are the fleet quartiles of the metric over plants with
  # metrics_status = ok, computed at scoring time from plant_metrics. Fleet at the first 30-month run: capture_rate_potential
  # q25/q50/q75 = 0.61/0.65/0.69 (range 0.33-0.84), curtailment_pct 4.6%/7.7%/15.0% (max 28.8%). The fixed bands would
  # leave < 25% of plants in the 12-point bucket and < 25% in the 0-point bucket, so they discriminate less.
  breakpoint_mode: quantile    # fixed | quantile

  A_acquisition_discount:      # 30 pts — lower performance scores higher
    capture_rate:              # points by capture-rate band (fraction of hub average)
      metric: capture_rate_potential   # HSL-weighted: delivered-generation capture is flattered by curtailment
      max: 12
      fixed: [{lt: 0.55, pts: 12}, {lt: 0.65, pts: 8}, {lt: 0.75, pts: 4}, {else: 0}]
      quantile: {q25: 12, q50: 8, q75: 4, else: 0}
    curtailment_pct:
      metric: curtailment_pct
      max: 8
      fixed: [{gt: 0.20, pts: 8}, {gt: 0.10, pts: 5}, {else: 2}]
      quantile: {q75: 8, q50: 5, else: 2}
    cf_vs_benchmark:           # capacity-factor points below regional benchmark
      max: 6
      fixed: [{below_pts_gt: 4, pts: 6}, {below_pts_gt: 2, pts: 4}, {else: 1}]
    offtake_status:
      max: 4
      merchant: 4
      short_ppa_lt_5yr: 3
      long_ig_ppa: 0
      unknown: 2               # displayed with offtake_confidence = 'unknown'

  B_repowering_upside:         # 15 pts — module type is a vintage proxy (EIA-860 lacks poly/mono)
    polycrystalline: 6
    monofacial: 5
    vintage_tracker_or_fixed: 4
    vintage_proxy:             # COD year → assumed module class
      poly_monofacial_until: 2018
      mixed_until: 2020        # 2019–2020 score half of B
      mono_perc_from: 2021

  C_physical_envelope:         # 20 pts
    acres_per_mw_ac:
      max: 8
      # Rescaled 5 Oct 2026 to host-parcel acres per MW AC (acres_per_mw_parcel). 67 passing plants: q25 9.5, median 11.5,
      # q75 16.1 (min 5.8). Cut points 14 / 10 / 7 sit near q62 / q30 / below q25, so every band is populated.
      bands: [{gt: 14, pts: 8}, {gt: 10, pts: 6}, {gt: 7, pts: 3}, {else: 0}]
    expansion_headroom:        # (parcel acres − array acres) / array acres
      max: 7
      bands: [{gt: 0.50, pts: 7}, {gt: 0.20, pts: 4}, {else: 0}]
    unified_land_control: 5

  D_electrical:                # 20 pts
    poi_voltage_kv:
      max: 10
      bands: [{gte: 345, pts: 10}, {gte: 138, pts: 6}, {gte: 69, pts: 2}, {else: 0}]
      distribution_class_max_kv: 34.5   # sets distribution_class_poi flag
    distance_to_345kv_sub_mi:
      max: 5
      bands: [{lt: 5, pts: 5}, {lt: 15, pts: 2}, {else: 0}]
    load_pocket_proximity:
      max: 5
      source: manual           # hand-maintained table until PUCT load-queue transparency (Dec 2026)

  E_thermal_cooling:           # 15 pts — Komorebi-specific
    soil_lambda_w_mk:
      max: 6
      bands: [{gte: 2.0, pts: 6}, {gte: 1.5, pts: 4}, {gte: 1.0, pts: 2}, {else: 0}]
      thermal_response_test_flag_below: 1.0
    drillability:
      max: 4
    hours_below_25c_drybulb:
      max: 3
      bands: [{gte: 6000, pts: 3}, {gte: 5000, pts: 2}, {gte: 4000, pts: 1}, {else: 0}]
    depth_to_water_ft:
      max: 2
      bands: [{gte: 200, pts: 2}, {gte: 100, pts: 1}, {else: 0}]

  F_fixed_cost_drag:           # penalty −15..0, on fixed_cost_per_kw_it
    bands: [{lt: 100, pts: 0}, {lt: 250, pts: -5}, {lt: 450, pts: -10}, {else: -15}]

crosswalk:                     # Phase 3a EIA ↔ ERCOT matching; scores are rapidfuzz 0–100
  name_high: 85                  # token-set similarity of normalized names
  name_medium: 70
  name_min: 55                   # below this a unit is not a candidate unless MW + year + county all agree
  mw_tolerance_high: 0.10        # |Σ ERCOT MW − EIA AC MW| / EIA AC MW
  mw_tolerance_medium: 0.25
  year_tolerance: 1              # |CDR in-service year − EIA COD year|
  # Unit-subset choice for multi-unit / sibling plants (Prospero vs Prospero II): minimise
  #   |Σ unit MW − EIA MW| / EIA MW + phase_penalty × units whose phase number disagrees with the name
  #                                  + year_penalty × units whose in-service year is outside the COD window
  phase_penalty: 0.05            # a tiebreaker, not a veto: RE Maplewood 250 MW = Redbarn 1 (222) + Redbarn 2 (28)
  year_penalty: 0.10
  max_candidates: 10             # exhaustive subset search over at most this many units (2^10 combinations)
  # words dropped before comparing names (EIA "Taygete Energy Project LLC" vs CDR "TAYGETE SOLAR")
  stopwords: [solar, energy, project, projects, llc, lp, inc, farm, pv, power, plant, center, facility, the, park, station, generation, generating, texas, tx, hybrid]

benchmarks:
  cf_plausible_range: [0.05, 0.40]   # net AC CF outside this gets cf_note = outside_plausible_range (not dropped)
  regional_cf:                 # net AC capacity factor; fill from fleet medians in Phase 3
    west_texas: null
    central_texas: null
    coastal: null
  capture_rate_reference:      # brief cited ~0.57 standalone / ~0.72 co-located (H1 2025, unverified)
    standalone: 0.57
    colocated: 0.72

market_window:
  months: 36
  api_history_floor: 2023-12-11    # ERCOT Public API — earlier data needs MIS archive backfill

# Phase 3b — curtailment and capture rate from the 60-day SCED disclosure and 15-minute real-time SPP.
#   curtailment_pct = Σ max(HSL − Base Point, 0)·Δt / Σ HSL·Δt          (per SCED interval, PVGR resources)
#   capture_rate    = (Σ gen·SPP_node / Σ gen) / time-average SPP_hub   (hub = hub_reference, same intervals)
#   shape_capture   = same with the hub price at the plant's generation hours  (solar-shape discount only)
#   basis_ratio     = Σ gen·SPP_node / Σ gen·SPP_hub                      (location discount only; capture = shape × basis)
market_metrics:
  sced_lag_days: 62                # latest operating day = today − lag (disclosure posts 60 days late)
  sced_interval_minutes_default: 5 # used for the last interval of a day and any gap-less resource
  max_interval_minutes: 15         # a longer gap between SCED runs is treated as a gap, not curtailment
  hub_reference: HB_HUBAVG
  price_locations_extra: [HB_NORTH, HB_SOUTH, HB_WEST, HB_HOUSTON, HB_BUSAVG]
  min_month_coverage: 0.90         # share of a month's days with SCED data for the month to enter the summary
  min_gen_mwh_for_capture: 100     # below this a plant gets no capture_rate (price-weighting on nothing)
  throttle_seconds: 1.0            # pause between ERCOT API calls
  retries: 3

caveat_flags:                  # displayed on every dossier; never scored
  - load_import_not_screenable
  - sb6_large_load_risk
  - mineral_severance_check_required
  - btm_configuration_unsettled
  - ch313_jeti_expiry_check
  - sb6_colocation_review        # planned_load_mw >= 75
  - tax_equity_consent_likely    # COD >= 2019

validation:
  reference_counties: [Pecos, Falls]
