      #     git config user.email "refresh-bot@users.noreply.github.com"
      #     git add data/crosswalk_eia_ercot.csv
      #     git diff --cached --quiet || git commit -m "chore: crosswalk export from refresh run ${{ github.run_id }}"
      #     git push

