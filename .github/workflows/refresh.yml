# Monthly data refresh. Phases 1–2 (plant master) are live; later phases are added as they are written.
name: refresh

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run (all | N | N-M); implemented: 1, 2"
        default: "all"
      county:
        description: "Optional county filter for validation runs (e.g. Pecos)"
        default: ""
  schedule:
    # 06:00 UTC on the 5th of each month — after EIA-860M for the prior month is published
    - cron: "0 6 5 * *"

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
      ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
      ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
      NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate config
        run: python -c "import yaml; c=yaml.safe_load(open('pipeline/config.yaml')); print('config', c['version'], 'ok')"

      - name: Unit tests
        run: pytest -q

      - name: Run pipeline
        run: python -m pipeline.run --phase "${{ github.event.inputs.phase || 'all' }}" ${{ github.event.inputs.county && format('--county {0}', github.event.inputs.county) || '' }}

      # Plant master + hand-check report, downloadable from the run page (Supabase load comes after sign-off)
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            data/plants.parquet
            data/uspvdb_orphans_tx.parquet
            data/validation/
          if-no-files-found: warn
          retention-days: 30

