# Monthly data refresh: phases 1, 2 and 5 (plant master, rescore) with a load to Supabase. Phases 3 / 3b / 4 need hand-downloaded
# files and multi-hour caches, so they run on the owner's machine; their results reach this job through the `pipeline-state`
# bucket (python -m pipeline.state push, after a local run). The job refuses to run without that state.
name: refresh

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phases to run (N | N-M | N,M,...); the monthly default is 1,2,5"
        default: "1,2,5"
      load:
        description: "Write plants and scores to Supabase (true | false)"
        default: "true"
      county:
        description: "Optional county filter for validation runs (e.g. Pecos)"
        default: ""
  schedule:
    # 06:00 UTC on the 5th of each month — after EIA-860M for the prior month is published
    - cron: "0 6 5 * *"

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
      ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
      ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
      NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
      NLR_API_EMAIL: ${{ secrets.NLR_API_EMAIL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate config
        run: python -c "import yaml; c=yaml.safe_load(open('pipeline/config.yaml')); print('config', c['version'], 'ok')"

      - name: Unit tests
        run: pytest -q

      # Layers (Phase 4) and market metrics (Phase 3b) built on the owner's machine. Without them a load would drop the parcel
      # footprint basis and the metrics, so this step fails the job when no state is stored.
      - name: Pull pipeline state
        run: python -m pipeline.state pull

      - name: Run pipeline
        run: python -m pipeline.run --phase "${{ github.event.inputs.phase || '1,2,5' }}" ${{ (github.event.inputs.load || 'true') == 'true' && '--load' || '' }} ${{ github.event.inputs.county && format('--county {0}', github.event.inputs.county) || '' }}

      # ercot_pv_conversion_screen.xlsx from the database (default weights) → Supabase Storage `exports`
      # (snapshots/<date>_<run id>.xlsx + _latest.xlsx, served by the app at /export/latest). Same code as the Export button.
      # Runs after the load, so the snapshot is the freshly loaded database.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Write XLSX snapshot to Storage
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx --yes tsx scripts/export-upload.ts

      # Plant master + hand-check report, downloadable from the run page
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            data/plants.parquet
            data/uspvdb_orphans_tx.parquet
            data/validation/
          if-no-files-found: warn
          retention-days: 30

